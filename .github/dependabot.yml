# Dependabot configuration for the fewbie starter template.
#
# This repo is the single source of truth for the fewbie basic template
# (see ADR-004 in worldzhy/fewbie). Dependabot watches npm dependencies
# and GitHub Actions used by the template so generated apps start from a
# current, CVE-clean skeleton.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
    # Group patch-level bumps to reduce PR noise; minor/major stay separate
    # so breaking changes get individual review.
    groups:
      patch-updates:
        update-types:
          - "patch"
      # react and react-dom must always move in lockstep (react-dom pins a
      # peer on the exact react version). Without this group, dependabot
      # opens one PR per package and the second one fails npm ci on the
      # peer mismatch until the first is merged.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # next and eslint-config-next ship together; mismatched versions cause
      # lint/build skew.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
    # typescript-eslint (via eslint-config-next) does not support TypeScript 7
    # yet (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
    # Revisit once upstream ships TS 7 support.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # eslint-plugin-react (via eslint-config-next) peers cap at eslint ^9.7,
      # so eslint 10 fails peer resolution. Revisit when eslint-plugin-react
      # declares eslint 10 support.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
