# Build gate for the fewbie starter template.
#
# This repo IS the template (ADR-003 in worldzhy/devbie) — nightwatch's GitHub
# generate flow clones it as-is. A green build here is the only guarantee that
# generated apps start from a working skeleton, so the PR that promotes dev to
# main must produce a clean `next build`; that PR is the only path into main,
# and main re-runs nothing. Dependabot PRs target dev and merge without a run;
# their updates are verified at the following dev -> main PR.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Lockfile is tracked, so npm ci gives a reproducible install that
      # matches what the maintainer validated locally.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      # ADR-025: no template file may also be owned by a registry item, and the
      # template's framework/marked files must stay well-formed (the CLI
      # reports self-comparison explicitly instead of pretending to gate drift).
      - name: Template ownership check
        run: npm run check:template

      - name: Lint
        run: npm run lint

      # A test that only runs locally does not gate the generated skeleton
      # (R20-26): the smoke test ships with the template, so CI must run it.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Image gate (R15-06): generated apps deploy this Dockerfile, so a broken
      # build must fail here instead of at the consumer's first deployment.
      - name: Docker image build
        run: docker build --pull -t fewbie-starter:ci .
