# Build gate for the fewbie starter template.
#
# This repo IS the template (ADR-003 in worldzhy/devbie) — nightwatch's GitHub
# generate flow clones it as-is. A green build here is the only guarantee that
# generated apps start from a working skeleton, so the PR that promotes dev to
# main must produce a clean `next build`; that PR is the only path into main,
# and main re-runs nothing. Dependabot PRs target dev and merge without a run;
# their updates are verified at the following dev -> main PR.
name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    # Direct pushes to dev used to be ungated until the next dev -> main PR
    # (R1-22). The `guards` job covers them without the image cost.
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R12 for direct dev pushes: the PR job below only protects dev -> main, so a
  # framework change pushed straight to dev would otherwise reach the next
  # branch untouched. It runs the same gates as the PR (R82-24): a direct push
  # used to skip template ownership, tests and the build, so a broken template
  # could sit on dev until the promotion PR.
  guards:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # The ADR gate diffs the pushed range, so the previous head must be
          # present in the checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Template ownership check
        run: npm run check:template

      # ADR-074 D1: framework/shared host copy must not overlap `framework.common`.
      - name: Framework doctor
        run: npx fewbie doctor

      - name: Lint
        run: npm run lint

      - name: Structure gates
        run: npm run check:structure

      # `github.event.before` is all zeros for a branch's first push, where
      # there is nothing to diff against.
      - name: Framework ADR gate
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: npm run check:framework-adr -- --base ${{ github.event.before }}

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  verify:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # R12 compares the PR against its base branch, so the merge base must
          # be present in the checkout (the default shallow clone lacks it).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Lockfile is tracked, so npm ci gives a reproducible install that
      # matches what the maintainer validated locally.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      # ADR-025: no template file may also be owned by a registry module, and the
      # template's framework/marked files must stay well-formed (the CLI
      # reports self-comparison explicitly instead of pretending to gate drift).
      - name: Template ownership check
        run: npm run check:template

      # ADR-074 D1: framework/shared host copy must not overlap `framework.common`.
      - name: Framework doctor
        run: npx fewbie doctor

      - name: Lint
        run: npm run lint

      # R1/R5/R9/R10: page contract, sidebar shell, primitive copies and route
      # naming. The scripts ship with the template, so hosts run the same gate.
      - name: Structure gates
        run: npm run check:structure

      # R12: a framework-owned file change is a cross-host contract and needs a
      # design decision in the same PR. Only meaningful against a base branch.
      - name: Framework ADR gate
        if: github.event_name == 'pull_request'
        run: npm run check:framework-adr -- --base origin/${{ github.base_ref }}

      # A test that only runs locally does not gate the generated skeleton
      # (R20-26): the smoke test ships with the template, so CI must run it.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Image gate (R15-06): generated apps deploy this Dockerfile, so a broken
      # build must fail here instead of at the consumer's first deployment.
      - name: Docker image build
        run: docker build --pull -t fewbie-starter:ci .
