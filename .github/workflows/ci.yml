# Build gate for the fewbie starter template.
#
# This repo IS the template (ADR-003 in worldzhy/devbie) — nightwatch's GitHub
# generate flow clones it as-is. A green build here is the only guarantee that
# generated apps start from a working skeleton, so every push and PR must
# produce a clean `next build`.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Lockfile is tracked, so npm ci gives a reproducible install that
      # matches what the maintainer validated locally.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
